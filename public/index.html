<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MuseScore Viewer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>MuseScore Viewer</h1>
        <p>Seeded scores · click notation to seek · playhead follows audio</p>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <h2>Scores</h2>
        <div id="scoreList" class="score-list">Loading…</div>
      </aside>
      <section class="stage">
        <div id="status" class="status">Pick a seeded score.</div>
        <div id="meta" class="meta" hidden></div>
        <div class="player" id="playerBar" hidden>
          <button type="button" id="playBtn">Play</button>
          <button type="button" id="stopBtn" hidden>Stop</button>
          <span id="audioStatus" class="audio-status"></span>
          <audio id="audioEl" controls preload="metadata"></audio>
        </div>
        <div id="pages" class="pages"></div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
